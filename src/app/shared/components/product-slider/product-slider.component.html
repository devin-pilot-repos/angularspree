<section class="mt-3">
  <carousel
    [itemsPerSlide]="itemsPerSlide"
    [singleSlideOffset]="singleSlideOffset"
    [noWrap]="noWrap"
    [showIndicators]="false"
  >
    <slide *ngFor="let product of productsList; let i = index">
      <div class="col-6 col-sm-4 col-md-3 col-lg-2 product-box m-1 card p-1">
        <app-inner-product [product]="product" [showRating]="showRating">
        </app-inner-product>
      </div>
    </slide>
  </carousel>
  <hr />
</section>

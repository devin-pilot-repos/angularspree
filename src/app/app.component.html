<ngx-json-ld [json]="schema"></ngx-json-ld>
<div class="selected-theme">
  <section>
    <ngx-loading-bar color="red" [includeSpinner]="false"></ngx-loading-bar>

    <app-header
      *ngIf="currentUrl"
      [layoutState]="layoutState$ | async"
    ></app-header>

    <main class="main-body">
      <router-outlet></router-outlet>
    </main>
    <app-footer *ngIf="currentUrl"></app-footer>
  </section>
</div>
